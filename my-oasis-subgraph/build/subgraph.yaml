specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: MyOasisContract
    network: oasis
    source:
      address: "0xcFF6932F0fED0f562E96f9d9B125d706e400f087"
      abi: MyOasisContract
      startBlock: 12656971
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: MyOasisContract/MyOasisContract.wasm
      entities:
        - Transfer
        - Approval
        - User
      abis:
        - name: MyOasisContract
          file: MyOasisContract/MyOasisContract.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
